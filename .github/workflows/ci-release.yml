on:
  push:
    tags:
    - 'v*'

name: Publish releases

permissions:
  contents: read

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build project
        run: |
          make && mv hookbot hookbot_linux_amd64
      - name: Create Release and Upload Asset
        run: |
          gh release create "${GITHUB_REF_NAME}" ./hookbot_linux_amd64 \
            --title "${GITHUB_REF_NAME}" \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_docker_image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Build and push Docker image
        env:
          REPO_NAME: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          IMAGE_ID="ghcr.io/${REPO_NAME}"

          docker build -t "$IMAGE_ID:$TAG_NAME" .
          docker push "$IMAGE_ID:$TAG_NAME"
